spring.application.name=kafka-topic-creator
spring.main.web-application-type=none

# Kafka AdminClient
topic-creator.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092,localhost:39092}
topic-creator.kafka.client-id=${KAFKA_TOPIC_CREATOR_CLIENT_ID:kafka-topic-creator}
topic-creator.kafka.operation-timeout-seconds=${KAFKA_TOPIC_CREATOR_OPERATION_TIMEOUT_SECONDS:30}

# Topic defaults
topic-creator.kafka.topic-defaults.partitions=${KAFKA_TOPIC_DEFAULT_PARTITIONS:3}
topic-creator.kafka.topic-defaults.replication-factor=${KAFKA_TOPIC_DEFAULT_REPLICATION_FACTOR:3}
topic-creator.kafka.topic-defaults.min-insync-replicas=${KAFKA_TOPIC_DEFAULT_MIN_ISR:2}
topic-creator.kafka.topic-defaults.retention-ms=${KAFKA_TOPIC_DEFAULT_RETENTION_MS:604800000}
topic-creator.kafka.topic-defaults.segment-ms=${KAFKA_TOPIC_DEFAULT_SEGMENT_MS:86400000}
topic-creator.kafka.topic-defaults.compression-type=${KAFKA_TOPIC_DEFAULT_COMPRESSION_TYPE:producer}
