# Configuration properties for JWT token
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Kafka Commons
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092,localhost:39092}

# Kafka Producer
app.kafka.producer.client-id=${KAFKA_PRODUCER_CLIENT_ID:auth-application-producer}
app.kafka.producer.acks=all
app.kafka.producer.linger-ms=${KAFKA_PRODUCER_LINGER_MS:5}
app.kafka.producer.batch-size=${KAFKA_PRODUCER_BATCH_SIZE:16384}
app.kafka.producer.retries=${KAFKA_PRODUCER_RETRIES:5}
app.kafka.producer.compression-type=${KAFKA_PRODUCER_COMPRESSION_TYPE:zstd}
app.kafka.producer.delivery-timeout-ms=${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:120000}
app.kafka.producer.request-timeout-ms=${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:20000}
app.kafka.producer.enable-idempotence=true

# Kafka Streams
app.kafka.streams.state-dir=${KAFKA_STREAMS_STATE_DIR:./docker-data/kafka-streams}
